<!DOCTYPE html>

<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/default}">

		<section layout:fragment="contents" class="contents d-flex justify-content-center">
			<div class="user-box memo-bg my-5 p-5 rounded-lg">
				<h1 class="text-center">로그인</h1>
				<input type="text" class="form-control mt-5" placeholder="아이디" id="idInput">
				<input type="password" class="form-control mt-3" placeholder="password" id="passwordInput">
				<button type="button" class="btn btn-secondary btn-block mt-3" id="loginBtn">Login</button>
				<div class="text-center mt-4">
					<a href="/user/view/register">회원가입</a>
				</div>
			</div>
		
		</section>
		
		<script layout:fragment="script">
			
			// 좀더 좋은 ux 를 가진 로그인 페이지, 엔터로 로그인 되게 해보자. 
			// form 태그는 엔터로도 기능이 작동함. 
		
		
			$("#loginBtn").on("click", function(){
				
				let loginId = $("#idInput").val();
				let password = $("#passwordInput").val();
				
				if(loginId==""){
					alert("아이디를 입력해주세요");
					return;
				}
				if(password==""){
					alert("비밀번호를 입력해주세요");
					return;
				}
				
				
				$.ajax({
					type:"post"
					, url:"/user/login"
					, data:{"loginId":loginId, "password":password}
					, success:function(response){
						if(response.result=="success"){
							location.href="/post/view/list";
						} else {
							alert("아이디 비밀번호를 확인해주세요.");
						}
					} 
					, error:function(){
						alert("로그인 중 통신 에러");
					}
				})
				
				
			});
			
			
		</script>
		
</html>
