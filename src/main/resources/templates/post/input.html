<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/default}">
        
       
       
        
        <section layout:fragment="contents" class="contents d-flex justify-content-center">
        	<div class="memo-box my-3">
        		<h1 class="text-center">메모 입력</h1>
        		<input type="text" class="form-control my-2" placeholder="제목을 입력하세요" id="titleInput">
        		<textarea class="form-control" rows="10" placeholder="내용을 입력하세요" id="contentInput"></textarea>
        		<input type="file" class="mt-3" >
        		<div class="d-flex justify-content-between my-4">
        			<a href="/post/view/list" class="btn btn-secondary">목록으로</a>
        			<button type = "button" class="btn btn-secondary" id="saveBtn">저장</button>
        		</div>
        	</div>
        
        
        
        </section>
        
        
        <script layout:fragment="script">
        	$("#saveBtn").on("click", function(){
        		
        		let title = $("#titleInput").val();
        		let contents = $("#contentInput").val();
        		
        		if(title==""){
        			alert("제목 입력하세요");
        			return;
        		}
        		if(contents==""){
        			alert("내용 입력하세요");
        			return;
        		}
        		
        		
        		
        		$.ajax({
        			type:"post"
        			, url:"/post/create"
        			, data:{"title":title, "contents":contents}
        			, success:function(response){
        				if(response.result=="success"){
        					location.href="/post/view/list";
        				} else {
        					alert("메모 저장 실패 ");
        				}
        			}
        			, error:function(){
        				alert("메모저장 중 에러");
        			}
        				
        			
        		});
        	});
        </script>
        
        
        
</html>
